name: Check documentation URLs for broken links
on:
  workflow_dispatch:
  schedule:
    - cron: '20 8 * * 1'
permissions:
  contents: read
jobs:
  links:
    name: Validate public URLs in Markdown documentation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check documentation URLs for HTTP 404 and 410 responses
        run: python3 tools/check_links.py
