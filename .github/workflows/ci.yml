name: Check repository, formatting and host tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Repository checks and host tests
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Check out source and commit history for PR sign-offs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify each PR commit has the author’s DCO sign-off
        if: github.event_name == 'pull_request'
        run: python3 tools/check_dco.py
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Validate repository policies and local documentation links
        run: python3 tools/check_repository.py
      - name: Test release packaging and checksum protection
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install the locked versions of clang-format, CMake and Ninja
        run: |
          python3 -m venv "$RUNNER_TEMP/bridge-host"
          "$RUNNER_TEMP/bridge-host/bin/python" -m pip install --only-binary=:all: -c .devcontainer/python-tools.lock clang-format cmake ninja
          echo "$RUNNER_TEMP/bridge-host/bin" >> "$GITHUB_PATH"
      - name: Check C++ source formatting
        run: bash tools/format.sh --check
      - name: Build and test reconciliation, BLE decoding and enrollment on the host
        run: |
          cmake -S . -B build/host -G Ninja
          cmake --build build/host
          ctest --test-dir build/host --output-on-failure
