name: Manually build ESP32-S3 and H2 firmware and audit dependencies
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true
jobs:
  firmware:
    name: Compile ESP32-S3 and ESP32-H2 images and audit their dependencies
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Check out repository source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free runner disk space for the pinned development container
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Verify pinned development-container SDK revisions
        run: ./tools/dev.sh python3 tools/check_toolchain.py
      - name: ESP32-S3 firmware compilation
        run: ./tools/dev.sh idf.py -C firmware set-target esp32s3 build
      - name: Verify resolved Thread, BLE, Wi-Fi, and OTA configuration
        run: ./tools/dev.sh python3 tools/check_firmware_config.py
      - name: Matched H2 RCP compilation
        run: ./tools/dev.sh bash tools/build_rcp.sh
      - name: Dependency lock is reproducible
        run: git diff --exit-code -- firmware/dependencies.lock
      - name: Dependency and notice inventory (local artifact only)
        run: ./tools/dev.sh python3 tools/dependency_inventory.py build/dependency-review
      - name: Retain dependency review evidence (contains no firmware images)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-review
          path: build/dependency-review
          retention-days: 7
